name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # CEF is ~170 MB and monaco-editor ~18 MB; cmake/cef.cmake and
      # cmake/monaco.cmake unpack them into libs/ on first configure.
      - name: Cache CEF and Monaco
        uses: actions/cache@v4
        with:
          path: |
            libs/cef
            libs/monaco
          key: deps-${{ hashFiles('cmake/cef.cmake', 'cmake/monaco.cmake') }}

      - name: Configure
        run: cmake --preset x64-windows-rel

      - name: Build
        run: cmake --build --preset x64-windows-rel

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/x64-windows-rel/lje-imgui.dll,
                                 build/x64-windows-rel/lje-imgui `
                           -DestinationPath lje-imgui-x64-windows.zip

      - name: Parse changelog
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          path: CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.changes }}
          files: |
            lje-imgui-x64-windows.zip
            build/x64-windows-rel/lje-imgui.dll
